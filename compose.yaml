services:
  app:
    build:
      context: .
      target: development
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["pnpm", "dev"]

  redis:
    image: redis/redis-stack-server:latest
    command: redis-stack-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  node_modules:
  redis-data:
